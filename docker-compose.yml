services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bolao
      POSTGRES_USER: bolao
      POSTGRES_PASSWORD: bolao
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolao -d bolao"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bolao_postgres_data:/var/lib/postgresql/data

volumes:
  bolao_postgres_data:

